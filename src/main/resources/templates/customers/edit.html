<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Registration</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Edit Customer</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/api/v1/rm/customer/update/{id}(id=${customer.id})}"
                  th:object="${customer}" method="post">

                <div class="row mb-3">
                    <label class="col-sm-3 col-form-label">First Name</label>
                    <div class="col-sm-9">
                        <input type="text" th:field="*{firstName}" class="form-control"/>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-3 col-form-label">Last Name</label>
                    <div class="col-sm-9">
                        <input type="text" th:field="*{lastName}" class="form-control"/>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-3 col-form-label">Email</label>
                    <div class="col-sm-9">
                        <input type="email" th:field="*{email}" class="form-control"/>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-3 col-form-label">Phone</label>
                    <div class="col-sm-9">
                        <input type="text" th:field="*{phone}" class="form-control"/>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-3 col-form-label">Date of Birth</label>
                    <div class="col-sm-9">
                        <input type="date" id="dob"
                               th:value="${#temporals.format(customer.dob, 'yyyy-MM-dd')}"
                               name="dob"/>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-3 col-form-label">NIN</label>
                    <div class="col-sm-9">
                        <input type="text" disabled th:field="*{nin}" class="form-control"/>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-3 col-form-label">BVN</label>
                    <div class="col-sm-9">
                        <input type="text" disabled th:field="*{bvn}" class="form-control"/>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-3 col-form-label">Address</label>
                    <div class="col-sm-9">
                        <textarea th:field="*{address}" class="form-control"></textarea>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-3 col-form-label">Account Number</label>
                    <div class="col-sm-9">
                        <input type="text" disabled th:field="*{accountNumber}" class="form-control"/>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-3 col-form-label">Customer Type</label>
                    <div class="col-sm-9">
                        <select id="customerType" th:field="*{customerType}" class="form-select">
                            <option value="">-- Select Type --</option>
                            <option th:each="t : ${types}"
                                    th:value="${t}"
                                    th:text="${t}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-3 col-form-label">Classification</label>
                    <div class="col-sm-9">
                        <select id="classification" th:field="*{classification}" class="form-select">
                            <option value="">-- Select Classification --</option>
                            <option th:each="c : ${classes}"
                                    th:value="${c}"
                                    th:text="${c}">
                            </option>
                        </select>
                    </div>
                </div>


                <div class="row mb-3">
                    <label class="col-sm-3 col-form-label">KYC Level</label>
                    <div class="col-sm-9">
                        <input type="number" min="1" max="3" th:field="*{kycLevel}" class="form-control"/>
                    </div>
                </div>

                <div class="text-end">
                    <button type="submit" class="btn btn-success px-4">Update</button>
                    <a th:href="@{/api/v1/rm/customer}" class="btn btn-secondary px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
