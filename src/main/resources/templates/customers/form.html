<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Registration</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">New Customer Registration</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/api/v1/rm/customer}" th:object="${form}" method="post" novalidate>

                <div class="mb-3">
                    <label for="firstName" class="form-label">First Name</label>
                    <input id="firstName" th:field="*{firstName}" class="form-control" placeholder="Enter first name">
                    <div class="text-danger small" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                </div>

                <div class="mb-3">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input id="lastName" th:field="*{lastName}" class="form-control" placeholder="Enter last name">
                    <div class="text-danger small" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                </div>

                <div class="mb-3">
                    <label for="nin" class="form-label">NIN</label>
                    <input id="nin" th:field="*{nin}" class="form-control" placeholder="Enter NIN">
                    <div class="text-danger small" th:if="${#fields.hasErrors('nin')}" th:errors="*{nin}"></div>
                </div>

                <div class="mb-3">
                    <label for="bvn" class="form-label">BVN</label>
                    <input id="bvn" th:field="*{bvn}" class="form-control" placeholder="Enter BVN">
                    <div class="text-danger small" th:if="${#fields.hasErrors('bvn')}" th:errors="*{bvn}"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input id="email" th:field="*{email}" type="email" class="form-control" placeholder="Enter email">
                    <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label for="dob" class="form-label">Date of Birth</label>
                    <input id="dob" th:field="*{dob}" class="form-control" placeholder="Enter Date of Birth">
                    <div class="text-danger small" th:if="${#fields.hasErrors('dob')}" th:errors="*{dob}"></div>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Phone</label>
                    <input id="phone" th:field="*{phone}" class="form-control" placeholder="Enter phone number">
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Home Address</label>
                    <input id="address" th:field="*{address}" class="form-control" placeholder="Enter Home Address">
                    <div class="text-danger small" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>

                <div class="mb-3">
                    <label for="accountNumber" class="form-label">Account Number</label>
                    <input id="accountNumber" th:field="*{accountNumber}" class="form-control" placeholder="Enter account number">
                    <div class="text-danger small" th:if="${#fields.hasErrors('accountNumber')}" th:errors="*{accountNumber}"></div>
                </div>

                <div class="mb-3">
                    <label for="customerType" class="form-label">Customer Type</label>
                    <select id="customerType" th:field="*{customerType}" class="form-select">
                        <option value="">-- Select Type --</option>
                        <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="classification" class="form-label">Classification</label>
                    <select id="classification" th:field="*{classification}" class="form-select">
                        <option value="">-- Select Classification --</option>
                        <option th:each="c : ${classes}" th:value="${c}" th:text="${c}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="kycLevel" class="form-label">KYC Level (1 - 3)</label>
                    <input id="kycLevel" th:field="*{kycLevel}" type="number" min="1" max="3" class="form-control">
                </div>

                <div class="text-end">
                    <button type="submit" class="btn btn-success px-4">Save Customer</button>
                </div>

            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
