<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container-fluid mt-5">

    <!-- Flash Message -->
    <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${msg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Customer List</h4>
            <a th:href="@{/api/v1/rm/customer/new}" class="btn btn-light btn-sm">+ New Customer</a>
        </div>
        <div class="card-body p-0">

            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>NIN</th>
                    <th>BVN</th>
                    <th>Email</th>
                    <th>DOB</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Account No.</th>
                    <th>Type</th>
                    <th>Classification</th>
                    <th>KYC Level</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cust, stat : ${customers}">
                    <td th:text="${stat.index + 1}"></td>
                    <td th:text="${cust.firstName}"></td>
                    <td th:text="${cust.lastName}"></td>
                    <td th:text="${cust.nin}"></td>
                    <td th:text="${cust.bvn}"></td>
                    <td th:text="${cust.email}"></td>
                    <td th:text="${cust.dob}"></td>
                    <td th:text="${cust.phone}"></td>
                    <td th:text="${cust.address}"></td>
                    <td th:text="${cust.accountNumber}"></td>
                    <td th:text="${cust.customerType}"></td>
                    <td th:text="${cust.classification}"></td>
                    <td th:text="${cust.kycLevel}"></td>
                    <td>
                        <a th:href="@{/api/v1/rm/customer/{id}(id=${cust.id})}" class="btn btn-sm btn-warning">View</a>
                        <a th:href="@{/api/v1/rm/customer/edit/{id}(id=${cust.id})}" class="btn btn-sm btn-warning">Edit</a>
                        <form th:action="@{/api/v1/rm/customer/delete/{id}(id=${cust.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-danger"
                                    onclick="return confirm('Are you sure you want to delete this customer?');">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(customers)}">
                    <td colspan="14" class="text-center text-muted py-3">No customers found.</td>
                </tr>
                </tbody>
            </table>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
