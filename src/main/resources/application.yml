spring:
  application:
    name: case-study
  config:
    import: optional:file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:customerdb}?useEncoding=true&characterEncoding=UTF-8
    hikari:
      username: ${DB_USER_NAME:postgres}
      password: ${DB_PASSWORD:1234}
      driver-class-name: org.postgresql.Driver

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  mvc:
    hiddenmethod:
      filter:
        enabled: true
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: DEBUG
app:
  cors:
    allowed-origins: http://localhost:3000
server:
  port: 8885

encryption:
  SECRET: ${ENCRYPTION_SECRET:12344345}
  MODE: ${ENCRYPTION_MODE:DES}
key: ${KEY:1011100110110011101100111101010111101011001111101010101001110110110100111010001010111111011110010110101000000111100100010011010111101101000000010110101101010110100100110001111010110110001011010101101001101110100111000000011110010000101101000001001110100011}

iv: ${IV:10011001101100100100100010011111001000011001100010000111000010010110000000011011010000101000001111010101000110100011000001010010}

springdoc:
  api-docs:
    version: openapi_3_1
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    disable-swagger-default-url: true
    display-request-duration: true
    groups-order: desc
    operations-sorter: method
    use-root-path: true
    version: "@springdoc.version@"
  cache:
    disabled: true